function clear(){generation++;entries=[];selected=null;pending=0;resetPreview();$('file').value='';$('status').textContent='';refresh();}
function show(id){selected=id;resetPreview();const item=entries.find(x=>x.id===id);if(item?.model)render(item.model,null,item.name,item.fields);refresh();}
function refresh(){const good=entries.filter(x=>x.model).length,bad=entries.filter(x=>x.error).length;$('status').textContent=pending?'Reading files…':entries.length?`${good} ready`+(bad?` · ${bad} could not be read`:''):'';const list=$('files');list.replaceChildren();for(const item of entries){const row=el('div',undefined,'file-row'),button=el('button',undefined,'file-select');button.setAttribute('aria-pressed',String(selected===item.id));button.append(el('span',item.name,'file-name'),el('span',item.error|| (item.model?item.model.format+' · '+amount(item.model.payable,item.model.currency):'Reading…'),'file-detail'));button.onclick=()=>show(item.id);const remove=el('button','×','remove');remove.setAttribute('aria-label','Remove '+item.name);remove.onclick=()=>{entries=entries.filter(x=>x.id!==item.id);if(selected===item.id)show(entries.find(x=>x.model)?.id??null);else refresh();};row.append(button,remove);list.append(row)}$('toolbar').hidden=!entries.length;$('print-all').disabled=!entries.some(x=>x.model)||pending>0;$('print').disabled=!entries.find(x=>x.id===selected)?.model||pending>0;}
function decode(buffer){const b=new Uint8Array(buffer);let encoding='utf-8';if(b[0]===255&&b[1]===254)encoding='utf-16le';else if(b[0]===254&&b[1]===255)encoding='utf-16be';else if(b[0]===0&&b[1]===60)encoding='utf-16be';else if(b[0]===60&&b[1]===0)encoding='utf-16le';else{const h=new TextDecoder('ascii').decode(b.slice(0,250));const match=h.match(/<\?xml[^>]*encoding\s*=\s*["']([^"']+)/i);if(match)encoding=match[1];}return new TextDecoder(encoding,{fatal:true}).decode(buffer);}
async function loadFiles(files){const ticket=generation;const batch=Array.from(files);if(!batch.length)return;if(entries.length+batch.length>50){$('status').textContent='Choose up to 50 files at a time. Clear the list to start a new batch.';return;}pending++;const items=batch.map(file=>({id:++nextId,name:file.name,file}));entries.push(...items);refresh();$('status').textContent='Reading files…';
for(const item of items){try{const file=item.file;if(file.size>5*1024*1024)throw Error('File too large (maximum 5 MB).');if(!file.size)throw Error('Empty file.');const source=decode(await file.arrayBuffer());if(ticket!==generation)return;if(/<!DOCTYPE|<!ENTITY/i.test(source))throw Error('DTD and entity declarations are not allowed.');const doc=new DOMParser().parseFromString(source,'application/xml');if(doc.getElementsByTagName('parsererror').length||doc.documentElement.localName==='parsererror')throw Error('Malformed XML. Export the invoice again.');if(doc.getElementsByTagName('*').length>30000)throw Error('Too many XML elements (maximum 30,000).');item.fields=fields(doc.documentElement);item.model=parseInvoice(doc);}catch(e){item.error=e.message||'Unable to read this file.';}delete item.file;if(ticket!==generation)return;}
pending--;if(!entries.find(x=>x.id===selected)?.model)show(entries.find(x=>x.model)?.id??null);else refresh();const good=entries.filter(x=>x.model).length,bad=entries.filter(x=>x.error).length;$('status').textContent=pending?'Reading files…':`${good} ready`+(bad?` · ${bad} could not be read`:'');$('file').value='';}
$('file').addEventListener('change',e=>loadFiles(e.target.files));$('clear').addEventListener('click',clear);$('appendix').addEventListener('change',()=>show(selected));$('print').addEventListener('click',()=>window.print());
$('print-all').addEventListener('click',()=>{const saved=selected,sheets=[];for(const item of entries.filter(x=>x.model)){render(item.model,null,item.name,item.fields);const sheet=$('preview').firstElementChild;sheet.querySelector('#appendix-note')?.removeAttribute('id');sheets.push(sheet);}$('preview').replaceChildren(...sheets);document.title='Invoices';const restore=()=>show(saved);window.addEventListener('afterprint',restore,{once:true});try{window.print();}catch(e){window.removeEventListener('afterprint',restore);restore();$('status').textContent='Printing could not start. Try again in Chrome or Firefox.';}});
const drop=$('drop');let dragDepth=0;document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;drop.classList.remove('drag');loadFiles(e.dataTransfer.files)});drop.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;drop.classList.add('drag')});drop.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;drop.classList.remove('drag')}});
</script></body></html>
